name: Release

# release-please (release-please-config.json) keeps one release PR open on
# main: the next version, from the Conventional Commit titles merged since the
# last tag, and its CHANGELOG.md section. Merging that PR releases it: once CI
# passes on main, release-please tags the merge commit and creates the GitHub
# release with that section as its notes, and goreleaser uploads the archives
# to it.
#
# release-please acts as the bot-cecil GitHub App (the identity the other
# coredev-uk repositories use), not as GITHUB_TOKEN: GitHub starts no workflow
# for what GITHUB_TOKEN does, so the release PR would never get its CI run, and
# the repository setting "Allow GitHub Actions to create and approve pull
# requests" would have to be on. The App's token is minted in the job by
# octo-sts (octo-sts.hera.ac, which holds the App's key): it exchanges the
# job's OIDC token under .github/chainguard/release-please.sts.yaml, and lives
# for that job only. The `bot-cecil` environment limits the run to main and v*
# tags.
#
# goreleaser still runs here rather than from a tag-push trigger: the tag the
# App creates starts no run of its own (it would need a v* trigger and would
# race the release). It uploads to the existing release with the workflow's
# GITHUB_TOKEN (contents: write, this job only): uploading assets needs no
# workflow to start afterwards, so it needs no App token.
#
# A release whose goreleaser step failed: run this workflow by hand with its
# tag (Actions → Release → Run workflow); that only runs goreleaser.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to build and upload the archives for (v1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Everything goes through the App token below, minted by octo-sts; the
    # environment limits the run to main and v* tags.
    environment: bot-cecil
    permissions:
      id-token: write # the OIDC token octo-sts exchanges for bot-cecil's
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The trust policy .github/chainguard/release-please.sts.yaml grants
      # contents, issues and pull-requests write.
      - name: Generate bot-cecil token
        id: app-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: octo-sts.hera.ac
          scope: ${{ github.repository }}
          identity: release-please

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the archives to the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build and upload the archives
        run: nix develop -c goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
