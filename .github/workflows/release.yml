name: Release

# release-please (release-please-config.json) keeps one release PR open on
# main: the next version, from the Conventional Commit titles merged since the
# last tag, and its CHANGELOG.md section. Merging that PR releases it: once CI
# passes on main, release-please tags the merge commit and creates the GitHub
# release with that section as its notes, and goreleaser uploads the archives
# to it.
#
# A tag or release made with GITHUB_TOKEN starts no other workflow run, so
# goreleaser runs here rather than from a tag-push trigger. With GITHUB_TOKEN
# the release PR also gets no CI run of its own (it only touches
# CHANGELOG.md and .release-please-manifest.json); a RELEASE_PLEASE_TOKEN
# secret (a fine-grained token or app token with contents and pull-requests
# write) makes it get one.
#
# A release whose goreleaser step failed: run this workflow by hand with its
# tag (Actions → Release → Run workflow); that only runs goreleaser.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to build and upload the archives for (v1.2.3)"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Build and upload the archives
        run: nix develop -c goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
